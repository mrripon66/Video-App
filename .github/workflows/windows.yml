name: Test and build Windows installer

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows tests and installer
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked build dependencies
        run: npm ci --no-audit --no-fund
      - name: Install verified offline voice runtime and model
        run: npm run setup:voice
      - name: Verify and stage the local video assembly tool
        run: npm run setup:media
      - name: Verify and stage the offline narration engine
        run: npm run setup:narration
      - name: Check application source
        run: npm run check
      - name: Test persistence, longer-video assembly, queue and provider contracts
        run: npm test
      - name: Test desktop application without paid requests
        run: npm run test:desktop
      - name: Test saved-provider-request recovery
        run: npm run test:recovery
      - name: Verify local video playback
        run: npm run test:library
      - name: Verify vertical Reel export with local sound
        run: npm run test:reel
      - name: Verify offline voice transcription on a public sample
        run: npm run test:voice
      - name: Build per-user Windows installer
        run: npm run dist:win
      - name: Install and verify the packaged app
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/AI-Video-Studio-Setup-*-x64.exe | Select-Object -First 1
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $appPath = Join-Path $env:LOCALAPPDATA 'Programs\AI Video Studio\AI Video Studio.exe'
          node scripts/packaged-smoke.js $appPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $voicePath = Join-Path $env:LOCALAPPDATA 'Programs\AI Video Studio\resources\voice'
          node scripts/test-voice.js $voicePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding utf8
          }
      - name: Upload installer and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AI-Video-Studio-Windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload desktop test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
